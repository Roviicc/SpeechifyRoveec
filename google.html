<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Lumen — Google Drive</title>
    <!--
      Google sign-in + Picker page. Served WITHOUT Cross-Origin-Opener/Embedder-Policy (see vercel.json and
      vite.config.ts) so the Google Identity Services popup keeps window.opener and the Picker iframe can load.
      The main app is cross-origin isolated and talks to this page over a BroadcastChannel.
    -->
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
      main { max-width: 360px; padding: 24px; text-align: center; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 20px; font-size: 15px; line-height: 1.45; opacity: 0.8; }
      button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; min-height: 48px; padding: 0 24px; cursor: pointer; }
      #go { background: #2f54eb; color: #fff; width: 100%; }
      #go[hidden] { display: none; }
      #cancel { background: transparent; color: inherit; opacity: 0.7; margin-top: 8px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Lumen · Google Drive</h1>
      <p id="status" data-testid="bridge-status">Loading…</p>
      <button id="go" type="button" hidden data-testid="bridge-continue">Continue with Google</button>
      <button id="cancel" type="button">Cancel</button>
    </main>
    <script type="module" src="/src/sync/signin-page/main.ts"></script>
  </body>
</html>
